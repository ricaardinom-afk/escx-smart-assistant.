name: Validate feature branch

on:
  push:
    branches:
      - feature/simplified-public-booking
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: escx-smart-assistant-feature-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/simplified-public-booking
          persist-credentials: true

      - name: Set up Node.js for Nitro 3
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies and regenerate Bun lockfile
        run: bun install

      - name: Commit regenerated lockfile when needed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: regenerate Bun lockfile"
            git push origin HEAD:feature/simplified-public-booking
          fi

      - name: Verify frozen lockfile installation
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: ESLint (full repository; formatting baseline)
        run: bun run lint
        continue-on-error: true

      - name: ESLint excluding formatting-only rule
        run: bunx eslint . --rule 'prettier/prettier: off'

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
